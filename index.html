<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login with Webcam Capture</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required><br>
            <input type="password" id="password" placeholder="Password" required><br>

            <!-- CAPTCHA Section -->
            <canvas id="captchaCanvas"></canvas>
            <button type="button" id="refreshCaptcha">🔄 Refresh</button><br>
            <input type="text" id="captchaInput" placeholder="Enter CAPTCHA" required>

            <button type="submit" id="loginButton" disabled>Login</button>
        </form>
        <p id="message"></p>
        <p id="countdown" class="hidden"></p>

        <!-- Webcam Preview & Capture -->
        <div class="camera-container">
            <video id="webcam" autoplay></video>
            <canvas id="snapshotCanvas" class="hidden"></canvas>
            <img id="capturedImage" class="hidden">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
